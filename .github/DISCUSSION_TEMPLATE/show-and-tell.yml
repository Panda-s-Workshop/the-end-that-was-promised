body:
  - type: markdown
    attributes:
      value: |
        Share your finds: biomes and structures you found, boss kills, End builds, and modpacks with The End That Was Promised. Seeds and coordinates let others visit the same places.

  - type: textarea
    id: show
    attributes:
      label: What you'd like to share
      description: Drag screenshots straight into this box.
    validations:
      required: true

  - type: input
    id: seed
    attributes:
      label: Seed and coordinates
      placeholder: Seed 1111, a Fallen Observatory at 3150 70 -400 in the End
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: The End That Was Promised version
      placeholder: 0.1.0
    validations:
      required: false
