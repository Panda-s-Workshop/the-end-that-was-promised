name: ⚔️ Conflict with another mod
description: Something breaks only together with another mod, datapack or modpack.
labels: ["type: mod conflict", "status: needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        If the game crashes, use the **Crash report** form and mention the other mod there. To ask whether mods work together, use [Discussions › Compatibility & modpacks](https://github.com/Panda-s-Workshop/the-end-that-was-promised/discussions/categories/compatibility-modpacks).

  - type: input
    id: other
    attributes:
      label: The other mod or datapack
      description: Its name, version and a link to its page.
      placeholder: Apotheosis 9.0.0, https://www.curseforge.com/minecraft/mc-mods/apotheosis
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: What goes wrong?
      description: Screenshots help a lot.
      placeholder: With both installed the outer End only has vanilla biomes.
    validations:
      required: true

  - type: dropdown
    id: without
    attributes:
      label: Does it happen without the other mod?
      options:
        - "No, only with it"
        - "Yes, it happens without it too"
        - "I haven't tried"
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - End terrain, biomes and structures
        - The dragon fight and Wrath
        - Constructs and bosses
        - Gear, the Void Anchor and elytra augments
        - Rift Gates, shrines and Starfall
        - Screens and the Promise Codex
        - Something else
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: The End That Was Promised version
      description: From the jar's name or the mods list, such as 0.1.0.
      placeholder: 0.1.0
    validations:
      required: true

  - type: input
    id: neoforge
    attributes:
      label: NeoForge version
      description: The End That Was Promised is for Minecraft 26.3 on NeoForge and Fabric.
      placeholder: 26.3.0.89
    validations:
      required: true

  - type: textarea
    id: mods
    attributes:
      label: Other mods
      description: The rest of your mod list, or the modpack's name and version.
    validations:
      required: false

  - type: input
    id: log
    attributes:
      label: Log
      description: Upload `logs/latest.log` to [mclo.gs](https://mclo.gs) and paste the link.
      placeholder: https://mclo.gs/...
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched the open and closed issues for this mod.
          required: true
