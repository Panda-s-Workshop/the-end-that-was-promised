architectury {
    common("fabric", "neoforge")
}

loom {
    accessWidenerPath = file("src/main/resources/promisedend.accesswidener")
}

dependencies {
    // the Fabric loader brings the Mixin library (and @Environment) that common code compiles against
    implementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    // GeckoLib's loader-neutral API; each loader module brings its own GeckoLib at runtime
    compileOnly "com.geckolib:geckolib-common-${rootProject.minecraft_version}:${rootProject.geckolib_version}"
    // unit tests load classes that name GeckoLib types (the Warden), so its common jar is on their classpath too
    testRuntimeOnly "com.geckolib:geckolib-common-${rootProject.minecraft_version}:${rootProject.geckolib_version}"

    testImplementation platform("org.junit:junit-bom:5.14.4")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    testImplementation "com.google.code.gson:gson:2.14.0"
}

test {
    useJUnitPlatform()
}
